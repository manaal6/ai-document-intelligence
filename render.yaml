services:
  # Backend API
  - type: web
    name: ai-doc-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./documents.db
    healthCheckPath: /health

  # Frontend
  - type: static_site
    name: ai-doc-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to your backend URL, e.g. https://ai-doc-backend.onrender.com
    routes:
      - type: rewrite
        from: /*
        to: /index.html
